# macOS ランナーで .ipa を作り、TestFlight へ上げる。
#
# 手元に Mac が無くても提出できるようにするためのもの。
# 必要なシークレットは docs/IOS.md の §5 に一覧がある。
#
# 手で走らせる（workflow_dispatch）ようにしてあるのは、
# プライベートリポジトリだと macOS ランナーが分単位で10倍消費されるため。
# push のたびに走らせると無料枠が数日で溶ける。

name: iOS

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "TestFlight まで上げる（false ならビルドだけ）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      # 設計の主張が壊れたまま提出しないための関門。
      # ここが落ちたらビルドまで行かせない。
      - name: 検証
        run: |
          npx playwright install --with-deps chromium
          npm run verify

      - name: アイコンと起動画面を描き出す
        run: npm run icons

      - name: web をビルドして iOS へ同期
        run: npm run ios:sync

      # 署名。ランナーは使い捨てなので、専用のキーチェーンを作って放置してよい。
      - name: 証明書とプロファイルを入れる
        if: ${{ inputs.upload }}
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="${TEAM_ID:-}" \
            CODE_SIGNING_ALLOWED=${{ inputs.upload && 'YES' || 'NO' }} \
            archive

      - name: .ipa を書き出す
        if: ${{ inputs.upload }}
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: TestFlight へ上げる
        if: ${{ inputs.upload }}
        env:
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: 成果物を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ${{ runner.temp }}/export/*.ipa
            store/icon-1024.png
          if-no-files-found: ignore
