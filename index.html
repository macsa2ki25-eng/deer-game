<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#11140e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>下ばっか見てると</title>
<style>
  :root{
    --bg:#11140e;
    --ink:#e3e8da;
    --muted:#8d977f;
    --dim:#5e6751;
    --accent:#a87a4a;
    --line:#333d28;
    --font:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
  body{
    display:flex;flex-direction:column;align-items:center;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;
  }

  /* バナー広告。指の来ない最上部だけ。ネイティブ側が実体を置く。 */
  #ad{flex:none;width:100%;height:0}

  /* **画面全部がゲームで、画面全部がボタン。**
     押す/離すしか無いので、操作用の区画を切る必要がない。 */
  #stage{
    flex:1;width:100%;min-height:0;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);cursor:pointer;
  }
  #screen{
    display:block;max-width:100%;max-height:100%;
    width:auto;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }

  /* 操作の案内。1回でも触ったら消える。 */
  #hint{
    position:absolute;left:0;right:0;bottom:8px;text-align:center;
    font-size:12px;color:var(--muted);pointer-events:none;
    transition:opacity .3s;letter-spacing:.06em;
  }
  #stage.touched #hint{opacity:0}

  /* 画面（タイトル・リザルト）。ゲームの上に重ねる。 */
  #screens{position:fixed;inset:0;z-index:5;display:none;background:rgba(17,20,14,.94)}
  #screens.show{display:block}
  .screen{
    display:none;height:100%;padding:24px 20px;flex-direction:column;
    gap:18px;align-items:center;justify-content:center;text-align:center;
  }
  .screen.show{display:flex}
  h1{font-size:clamp(24px,8vmin,38px);letter-spacing:.04em;line-height:1.3}
  .sub{font-size:13px;color:var(--muted);line-height:1.9}
  .big{font-size:clamp(30px,11vmin,52px);color:#e6c06a;font-family:ui-monospace,monospace}
  button{
    font-family:var(--font);font-weight:700;letter-spacing:.06em;border:none;cursor:pointer;
    color:#11140e;background:var(--accent);font-size:16px;padding:.8em 2.4em;
  }
  button.ghost{background:none;color:var(--muted);border:1px solid var(--line);font-size:13px;padding:.6em 1.6em}
  button:hover{filter:brightness(1.1)}
  [hidden]{display:none !important}

  .how{
    display:flex;gap:14px;justify-content:center;font-size:12px;
    color:var(--muted);line-height:1.7;max-width:340px;
  }
  .how div{flex:1;border:1px solid var(--line);padding:10px 8px}
  .how b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
  #settings{display:flex;gap:16px;font-size:12px;color:var(--muted)}
  #settings label{display:flex;align-items:center;gap:6px;cursor:pointer}
  #settings input{accent-color:var(--accent);width:15px;height:15px}
</style>
</head>
<body>
  <div id="ad"></div>

  <div id="stage">
    <canvas id="screen" width="160" height="288"></canvas>
    <div id="hint">おしてる あいだ 下をみる</div>
  </div>

  <div id="screens">
    <section class="screen" id="sc-title">
      <h1>下ばっか見てると</h1>
      <div class="how">
        <div><b>おす</b>下をみる<br>フンをまたぐ<br><small>足はおそい</small></div>
        <div><b>はなす</b>前をみる<br>鹿をよける<br><small>足がはやい</small></div>
      </div>
      <p class="sub">どっちも いっぺんには 見られません</p>
      <button id="btn-start">はじめる</button>
      <div id="settings">
        <label><input id="sound" type="checkbox" checked>音</label>
      </div>
    </section>

    <section class="screen" id="sc-over">
      <p class="sub" id="over-why">くつが もうだめ</p>
      <div class="big" id="over-score">0</div>
      <p class="sub" id="over-best">さいこう 0</p>
      <button id="btn-retry">もういちど</button>
      <button class="ghost" id="btn-back">もどる</button>
    </section>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
