<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#11140e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>下ばっか見てると</title>
<style>
  :root{
    --bg:#11140e;
    --panel:#1a2015;
    --tile:#222a1b;
    --line:#333d28;
    --ink:#e3e8da;
    --muted:#8d977f;
    --dim:#5e6751;
    --accent:#a87a4a;
    --graze:#d8b45e;
    --dirt:#c04a3a;
    --font:"Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic",YuGothic,"Noto Sans JP",system-ui,sans-serif;
    --num:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font);
    overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---- 上段：ゲーム画面 ---- */
  #stage{position:relative;line-height:0;flex:none}
  #screen{
    display:block;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#3f6b34;
  }
  #overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;text-align:center;
    background:rgba(17,20,14,.88);line-height:1.65;padding:14px;
  }
  #overlay.hide{display:none}
  #ov-title{font-size:clamp(15px,4.6vmin,24px);font-weight:700;letter-spacing:.05em}
  #ov-body{font-size:clamp(11px,3vmin,14px);color:var(--muted)}
  button{
    font-family:var(--font);font-weight:700;letter-spacing:.05em;border:none;cursor:pointer;
    color:#11140e;background:var(--accent);font-size:clamp(12px,3.2vmin,15px);padding:.55em 1.8em;
  }
  button:hover{filter:brightness(1.1)}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  /* ---- 下段：スコアと操作パッド ---- */
  #panel{
    flex:1;width:100%;max-width:520px;min-height:0;
    display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;
  }
  #stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
  .tile{
    background:var(--tile);border:1px solid var(--line);padding:5px 8px;
    display:flex;flex-direction:column;gap:1px;min-width:0;
  }
  .tile.span2{grid-column:span 2}
  .tile.span3{grid-column:span 3;flex-direction:row;align-items:center;gap:10px}
  .label{font-size:10px;color:var(--dim);letter-spacing:.08em;line-height:1.4}
  .value{
    font-family:var(--num);font-variant-numeric:tabular-nums;
    font-size:15px;line-height:1.25;color:var(--ink);
  }
  .value.big{font-size:clamp(22px,7vmin,34px);color:var(--graze);line-height:1.1}
  .value small{font-size:10px;color:var(--muted);margin-left:2px}
  #mult-tile .value{color:var(--graze)}

  .bar{height:3px;background:#141a10;margin-top:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--graze);transition:width .07s linear}

  #dirt{display:flex;gap:4px;margin-left:auto}
  #dirt span{width:16px;height:10px;background:#141a10;border:1px solid var(--line)}
  #dirt span.on{background:var(--dirt);border-color:var(--dirt)}

  /* ---- パッド ---- */
  /* パッドは参道の見立て。縦が奥ゆき、横が参道の幅にそのまま対応する。 */
  #pad{
    flex:1;min-height:80px;position:relative;touch-action:none;cursor:crosshair;overflow:hidden;
    background:
      linear-gradient(180deg,rgba(168,122,74,.10) 0%,transparent 42%),
      repeating-linear-gradient(0deg,#1d2417 0 1px,transparent 1px 14px),
      repeating-linear-gradient(90deg,#1d2417 0 1px,transparent 1px 14px),
      var(--panel);
    border:1px solid var(--line);
  }
  .pad-edge{
    position:absolute;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.22em;
    color:var(--dim);pointer-events:none;
  }
  .pad-edge.top{top:4px}
  .pad-edge.bottom{bottom:4px}
  #pad-hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:12px;letter-spacing:.14em;pointer-events:none;
    transition:opacity .3s ease;
  }
  #pad.touched #pad-hint{opacity:0}
  .marker{position:absolute;left:0;top:0;pointer-events:none}
  /* キャラの実際の位置。指との差がそのまま「追いつく途中」の手応えになる。 */
  #pad-body{
    width:11px;height:11px;margin:-5.5px 0 0 -5.5px;background:var(--accent);
    box-shadow:0 0 0 2px rgba(17,20,14,.85), 0 0 0 3px rgba(168,122,74,.35);
  }
  #pad-finger{
    width:21px;height:21px;margin:-10.5px 0 0 -10.5px;
    border:1px solid var(--muted);border-radius:50%;opacity:.75;
  }

  #rotate{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:var(--bg);text-align:center;font-size:15px;padding:24px;z-index:10;
  }
  #rotate.show{display:flex}

  #gear{
    position:absolute;right:2px;top:2px;background:none;color:var(--dim);
    font-size:11px;padding:3px 7px;z-index:2;
  }
  #settings{
    position:absolute;right:2px;top:26px;display:none;z-index:3;
    background:var(--tile);border:1px solid var(--line);padding:9px 11px;min-width:160px;
  }
  #settings.show{display:block}
  #settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted);padding:3px 0;cursor:pointer}
  #settings input{accent-color:var(--accent);width:15px;height:15px}
</style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="screen" width="160" height="176"></canvas>
      <div id="overlay">
        <div id="ov-title">下ばっか見てると</div>
        <div id="ov-body"></div>
        <button id="ov-btn" type="button">はじめる</button>
      </div>
    </div>

    <div id="panel">
      <div id="stats">
        <div class="tile span2">
          <span class="label">スコア</span>
          <span class="value big" id="score">0</span>
        </div>
        <div class="tile">
          <span class="label">ベスト</span>
          <span class="value" id="best">0</span>
        </div>

        <div class="tile" id="mult-tile">
          <span class="label">ばいりつ</span>
          <span class="value" id="mult">×1.00</span>
          <div class="bar"><i id="gauge"></i></div>
        </div>
        <div class="tile">
          <span class="label">きょり</span>
          <span class="value"><span id="dist">0</span><small>m</small></span>
        </div>
        <div class="tile">
          <span class="label">グレイズ</span>
          <span class="value" id="graze">0</span>
        </div>

        <div class="tile span3">
          <span class="label">よごれ</span>
          <div id="dirt"></div>
        </div>
      </div>

      <div id="pad">
        <span class="pad-edge top">おく</span>
        <span class="pad-edge bottom">てまえ</span>
        <div id="pad-hint">ここを なぞる</div>
        <div class="marker" id="pad-finger"></div>
        <div class="marker" id="pad-body"></div>
      </div>
    </div>

    <button id="gear" type="button">設定</button>
    <div id="settings">
      <label><span>音</span><input id="sound" type="checkbox" checked></label>
      <label><span>観光客</span><input id="tourists" type="checkbox"></label>
    </div>
  </div>

  <div id="rotate">端末を縦にしてください</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
